name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OrderInventory.slnx
      - name: Build
        run: dotnet build OrderInventory.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OrderInventory.slnx --configuration Release --no-build
