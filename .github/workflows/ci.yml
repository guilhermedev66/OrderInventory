name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OrderInventory.slnx
      - name: Build
        run: dotnet build OrderInventory.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OrderInventory.slnx --configuration Release --no-build

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
